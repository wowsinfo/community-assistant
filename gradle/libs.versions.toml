compose-material3 = "1.3.1"
compose-foundation = "1.7.6"
compose-material-icons-extended = "1.7.6"
gradle = "8.7.3"
kotlin = "2.1.0"

# existing versions
material = "1.12.0"
cardview = "1.0.0"
gridlayout = "1.0.0"
